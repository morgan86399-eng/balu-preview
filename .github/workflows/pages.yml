name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Live URL https://morgan86399-eng.github.io/balu-preview/ is served from
# morgan86399-eng/morgan86399-eng.github.io (user Pages: legacy, main, /).
# This repo has has_pages=false, so actions/deploy-pages@v4 404s and
# GITHUB_TOKEN cannot enable project Pages (403 Resource not accessible).
# After push, pages/index.html is copied onto that user-Pages path.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Restore pinned CDN index
        # vite build + write-cdn-index may rewrite pages/index.html to @main;
        # the committed pin (commit SHA + ?v=n13) is the live source of truth.
        run: git checkout -- pages/index.html && cp pages/index.html dist/index.html
      - name: Verify N13 live index
        run: |
          set -euo pipefail
          grep -F "?v=n13" pages/index.html dist/index.html
          grep -F "portrait-liubei.png" src/game/data.ts
          if grep -n 'src=.*n10-hotfix' pages/index.html dist/index.html; then
            echo "N10 hotfix script must not be loaded on live"
            exit 1
          fi
          JS=$(grep -oE 'preview-assets/index-[^"?]+\.js' pages/index.html | head -1)
          echo "live js $JS"
          grep -F "貂蟬短線測試" "preview-assets/$(basename "$JS")"
          grep -F "貂蟬列傳・初章既竟" "preview-assets/$(basename "$JS")"
          grep -F "八路總覽" "preview-assets/$(basename "$JS")"
          grep -F "八路初章既竟" "preview-assets/$(basename "$JS")"
          grep -F "八路既竟面板測試" "preview-assets/$(basename "$JS")"
          grep -F "八路總覽灰態測試" "preview-assets/$(basename "$JS")"
          grep -F "七路既竟面板測試" "preview-assets/$(basename "$JS")"
          grep -F "六路既竟面板測試" "preview-assets/$(basename "$JS")"
          grep -F "孫尚香短線測試" "preview-assets/$(basename "$JS")"
          grep -F "周瑜短線測試" "preview-assets/$(basename "$JS")"
          python3 - <<'PY'
          from pathlib import Path
          lb = Path("public/art/portrait-liubei.png").stat().st_size
          gy = Path("public/art/portrait-guanyu.png").stat().st_size
          assert lb != 1659891, lb
          assert lb != gy, (lb, gy)
          print("portraits ok", lb, gy)
          PY
      - name: Request user Pages sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST repos/morgan86399-eng/morgan86399-eng.github.io/dispatches -f event_type=sync-balu-preview || true
      - name: Purge jsDelivr caches
        continue-on-error: true
        run: |
          set +e
          for path in \
            pages/index.html \
            public/art/portrait-liubei.png \
            public/art/portrait-guanyu.png
          do
            curl -fsSL "https://purge.jsdelivr.net/gh/morgan86399-eng/balu-preview@main/${path}" || true
            echo
          done
          JS=$(grep -oE 'preview-assets/index-[^"?]+\.js' pages/index.html | head -1)
          PIN=$(grep -oE 'balu-preview@[0-9a-f]{7,40}' pages/index.html | head -1 | sed 's/balu-preview@//')
          if [ -n "$JS" ] && [ -n "$PIN" ]; then
            curl -fsSL "https://purge.jsdelivr.net/gh/morgan86399-eng/balu-preview@${PIN}/${JS}" || true
            echo
            curl -fsSL "https://purge.jsdelivr.net/gh/morgan86399-eng/balu-preview@${PIN}/pages/index.html" || true
            echo
          fi
